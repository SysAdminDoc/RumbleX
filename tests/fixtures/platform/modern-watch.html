<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Modern watch parity fixture</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font-family: sans-serif; }
    #watch-shell { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; padding: 16px; }
    #videoPlayer { width: 960px; max-width: 100%; height: 540px; background: #000; }
    #videoPlayer video { display: block; width: 100%; height: 100%; }
    #videoPlayer video.preload { display: none; width: 0; height: 0; }
    .media-page-related-media-desktop-sidebar { width: 320px; }
    rum-video-thumbnail[role="listitem"] { display: block; min-height: 120px; margin: 0 0 12px; }
    .rum-video-thumbnail__image { display: block; width: 160px; height: 90px; background: #333; }
    rum-text[role="heading"] { display: block; }
    .media-page-comments-container { display: block; padding: 12px; }
  </style>
</head>
<body>
  <header data-js="app_header"><nav id="main-menu"></nav></header>
  <main class="nonconstrained" data-js="media_container">
    <div id="watch-shell">
      <section id="watch-main">
        <h1 class="video-header-container__title">Modern Fixture Video</h1>
        <div id="videoPlayer">
          <div id="vid_vmodern123">
            <video class="preload"></video>
            <video class="active-media"></video>
          </div>
        </div>
        <div class="media-by-actions">
          <button data-js="media_engage_share" style="display:none">Hidden share</button>
          <button data-js="video_action_sub_menu_button">More actions</button>
        </div>
        <section class="media-description-section" data-js="media_description_section"></section>
        <section id="comments-host">
          <div id="video-comments" class="media-page-comments-container" data-js="media_page_comments_container" data-fixture-identity="original">
            <ul><li class="comment-item" data-comment-id="one"><span class="comment-text">Fixture comment</span></li></ul>
          </div>
        </section>
      </section>
      <aside class="media-page-related-media-desktop-sidebar">
        <rum-video-thumbnail role="listitem" video-title="Alpha Report" name="Creator Alpha" url="/valpha123-alpha-report.html" video-id="101" views="1234">
          <a href="/valpha123-alpha-report.html"><div class="rum-video-thumbnail__image"><img alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="></div></a>
          <a href="/c/creator-alpha">Creator Alpha</a>
          <rum-text role="heading">Alpha Report</rum-text>
        </rum-video-thumbnail>
        <rum-video-thumbnail role="listitem" video-title="Beta Briefing" name="Creator Beta" url="/vbeta456-beta-briefing.html" video-id="202" views="5678">
          <a href="/vbeta456-beta-briefing.html"><div class="rum-video-thumbnail__image"><img alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="></div></a>
          <a href="/c/creator-beta">Creator Beta</a>
          <rum-text role="heading">Beta Briefing</rum-text>
        </rum-video-thumbnail>
      </aside>
    </div>
  </main>
  <div id="portal" data-js="portal"></div>
</body>
</html>
